schema = 1
project = "cbar"

# Real Scroll/Wayland release-matrix and headless-session scripts remain explicit gates; unit tests alone are not their evidence.

[checks.rust]
kind = "commands"
commands = [["nix", "develop", "--no-update-lock-file", "--command", "cargo", "test", "--locked"]]

[checks.fmt]
kind = "cargo"
actions = ["fmt"]

[checks.mpris]
kind = "commands"
commands = [["nix", "develop", "--no-update-lock-file", "--command", "dbus-run-session", "--", "cargo", "test", "--locked", "--bin", "cbar", "clients::music::mpris::tests::idle_polling_releases_bus_subscriptions", "--", "--exact", "--ignored"]]
